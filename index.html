<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonlit Knight — A Storybook Deck-Builder</title>
<meta name="description" content="Moonlit Knight: a turn-based storybook deck-builder. Original art, cards and monsters.">
<link rel="preload" as="image" href="assets/ui/knight.jpg">
<link rel="preload" as="image" href="assets/ui/bg-table.jpg">
<style>
  :root{
    --ink:#e8ddc4; --ink-dim:#b8a97f; --gold:#d4af37; --red:#a83a3a;
    --panel:rgba(20,16,28,.88); --panel-border:#5a4a2f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:Georgia,'Times New Roman',serif; color:var(--ink);
    background:#0d0a14 url("assets/ui/bg-table.jpg") center/cover no-repeat fixed;
    overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .hidden{display:none !important;}

  /* ---------- Title screen ---------- */
  #title-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px; text-align:center;
    background:radial-gradient(ellipse at center, rgba(13,10,20,.25) 0%, rgba(13,10,20,.78) 100%);
  }
  #title-screen h1{
    font-size:clamp(44px, 8vw, 84px); letter-spacing:.08em; color:#f3e6c0;
    text-shadow:0 2px 0 #000, 0 0 28px rgba(212,175,55,.45);
  }
  #title-screen .subtitle{font-style:italic; color:var(--ink-dim); font-size:clamp(15px,2.4vw,20px);}
  #hero{width:min(300px, 62vw); border-radius:10px; border:3px solid var(--panel-border);
    box-shadow:0 12px 40px rgba(0,0,0,.7); will-change:transform;}
  .btn{
    font-family:inherit; font-size:20px; letter-spacing:.06em; cursor:pointer;
    color:#1a1206; background:linear-gradient(#e8c96a,#c9a227);
    border:2px solid #6b5320; border-radius:8px; padding:13px 42px;
    box-shadow:0 4px 0 #6b5320, 0 8px 22px rgba(0,0,0,.55);
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #6b5320;}
  .btn:disabled{opacity:.5; cursor:default; transform:none;}
  .btn.secondary{background:linear-gradient(#8a7a55,#6b5c3a); color:#f3e6c0; border-color:#3d3220; font-size:16px; padding:10px 28px;}
  #loading{font-size:15px; color:var(--ink-dim); font-style:italic; min-height:20px;}
  #version{position:absolute; bottom:10px; right:14px; font-size:12px; color:#8a7d5f;}
  #title-screen .foot{font-size:13px; color:#8a7d5f; max-width:520px; line-height:1.5;}

  /* ---------- Generic screens (filled in later stages) ---------- */
  #game-screen{flex:1; display:flex; flex-direction:column; position:relative;}
  #banner{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.9);
    font-size:clamp(30px,6vw,54px); color:#f3e6c0; letter-spacing:.1em;
    text-shadow:0 2px 0 #000, 0 0 30px rgba(212,175,55,.6);
    opacity:0; pointer-events:none; transition:opacity .35s ease, transform .35s ease;
    background:linear-gradient(rgba(60,40,20,.85),rgba(40,26,12,.85));
    border:2px solid var(--panel-border); border-radius:10px; padding:14px 44px; white-space:nowrap;
  }
  #banner.show{opacity:1; transform:translate(-50%,-50%) scale(1);}

  /* ---------- Combat screen (Stage 2) ---------- */
  #combat-root{position:absolute; inset:0;}
  .enemy-area{position:absolute; top:14px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px; width:min(420px, 80vw);}
  .enemy-portrait-wrap{position:relative; width:170px; height:170px;}
  .enemy-portrait{width:170px; height:170px; object-fit:cover; border-radius:8px;
    border:3px solid var(--panel-border); box-shadow:0 8px 28px rgba(0,0,0,.7);}
  .enemy-name{font-size:22px; letter-spacing:.05em; color:#f3e6c0; text-shadow:0 2px 0 #000;}
  .lv-tag{font-size:13px; color:var(--gold); border:1px solid var(--gold); border-radius:4px;
    padding:1px 7px; vertical-align:middle; letter-spacing:.08em;}
  .enemy-special{font-size:13px; font-style:italic; color:var(--ink-dim); text-align:center;}
  .bar{position:relative; width:100%; height:18px; background:rgba(0,0,0,.6);
    border:1px solid #4a3d24; border-radius:9px; overflow:hidden;}
  .bar.thin{height:7px; border-radius:4px;}
  .bar-fill{height:100%; transition:width .35s ease;}
  .hp-fill{background:linear-gradient(#c0392b,#8e2418);}
  .mana-fill{background:linear-gradient(#3a7bd5,#1e4f8f);}
  .bar-text{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; text-shadow:0 1px 2px #000; pointer-events:none;}
  .combat-log{position:absolute; left:14px; bottom:14px; width:min(300px, 30vw);
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    padding:8px 10px; font-size:13px; line-height:1.45; z-index:5;}
  .log-title{color:var(--gold); letter-spacing:.08em; font-size:12px; margin-bottom:4px;}
  .log-line{color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .log-notice{color:#e8a33d; font-style:italic; min-height:18px;}
  .equip-row{position:absolute; left:50%; bottom:246px; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px; min-height:44px;}
  .equip-empty{font-size:13px; font-style:italic; color:var(--ink-dim);}
  .equip-chip{width:42px; height:42px; border-radius:50%; overflow:hidden;
    border:2px solid var(--gold); box-shadow:0 2px 8px rgba(0,0,0,.6);}
  .equip-chip.counter{border-color:#c77dd8;}
  .equip-chip img{width:100%; height:100%; object-fit:cover;}
  .equip-slots{font-size:13px; color:var(--ink-dim); margin-left:4px;}
  .hud{position:absolute; left:50%; bottom:186px; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px; width:min(520px, 72vw);
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:8px 14px;}
  .hud-hp{flex:1; display:flex; align-items:center; gap:8px;}
  .hud-hp .bar{flex:1;}
  .armor-badge{font-size:15px; color:#8ec9ff; background:#12365e; border:1px solid #3a7bd5;
    border-radius:6px; padding:2px 8px; white-space:nowrap;}
  .hud-mana{flex:1;}
  .hud-mana .bar{width:100%;}
  .hud-action,.hud-gold{display:flex; align-items:center; gap:5px; font-size:17px; white-space:nowrap;}
  .hourglass{color:var(--gold);}
  .player-area{position:absolute; right:18px; bottom:14px; display:flex; align-items:flex-end; gap:12px;}
  .player-portrait-wrap{position:relative; width:120px; height:150px;}
  .player-portrait{width:120px; height:150px; object-fit:cover;
    border:3px solid var(--panel-border); border-radius:60px 60px 8px 8px;
    box-shadow:0 8px 24px rgba(0,0,0,.7);}
  .end-turn-btn{background:linear-gradient(#7bc96a,#3f8f2f); border-color:#245c18;
    box-shadow:0 4px 0 #245c18, 0 8px 22px rgba(0,0,0,.55); padding:12px 26px; font-size:18px;}
  .end-turn-btn:disabled{opacity:.45; cursor:default;}
  .hand{position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
    display:flex; align-items:flex-end; justify-content:center; gap:6px; z-index:10;}
  .hand-card{width:96px; height:146px; object-fit:cover; border-radius:6px; cursor:pointer;
    border:2px solid #3d3220; box-shadow:0 6px 18px rgba(0,0,0,.65);
    transform:rotate(var(--fan-rot, 0deg)) translateY(var(--fan-y, 0px));
    transform-origin:bottom center;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;}
  .hand-card.playable{border-color:#7fd4c1;}
  .hand-card.playable:hover,.hand-card.playable:focus-visible{
    transform:rotate(0deg) translateY(-58px) scale(1.9); z-index:60;
    box-shadow:0 0 0 2px #35e0d4, 0 0 26px rgba(53,224,212,.65), 0 18px 40px rgba(0,0,0,.8);}
  .hand-card.unplayable{filter:grayscale(.6) brightness(.72);}
  .hand-card.shake{animation:shake .3s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}}
  .float-layer{position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:40;}
  .floater{position:absolute; left:50%; top:32%; font-size:30px; font-weight:bold;
    text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); white-space:nowrap;
    animation:float-up 1s ease-out forwards; pointer-events:none;}
  .floater.dmg{color:#ff5a4a;}
  .floater.heal{color:#6fdc6f;}
  .floater.armor{color:#6fb7ff;}
  @keyframes float-up{
    0%{opacity:0; transform:translate(-50%,0) scale(.8);}
    15%{opacity:1; transform:translate(-50%,-14px) scale(1.1);}
    100%{opacity:0; transform:translate(-50%,-72px) scale(1);}}
  .overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; background:rgba(10,8,16,.78); z-index:100; text-align:center;}
  .overlay-title{font-size:clamp(40px,7vw,64px); color:#f3e6c0; letter-spacing:.08em;
    text-shadow:0 2px 0 #000, 0 0 30px rgba(212,175,55,.5);}
  .overlay-line{font-size:18px; color:var(--ink-dim); font-style:italic;}
  .overlay-btns{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}
</style>
</head>
<body>
<div id="app">
  <section id="title-screen">
    <h1>MOONLIT KNIGHT</h1>
    <div class="subtitle">A turn-based storybook deck-builder</div>
    <img id="hero" src="assets/ui/knight.jpg" alt="The Moonlit Knight" width="300" height="450" fetchpriority="high">
    <button id="start-btn" class="btn" disabled>Loading…</button>
    <div id="loading">Preparing the book…</div>
    <div class="foot">Original cards, monsters and art. Play cards, raise Armor, and turn the pages of the book — three chapters, one final witch.</div>
  </section>
  <section id="game-screen" class="hidden">
    <div id="banner"></div>
  </section>
  <div id="version">Moonlit Knight v0.2 — Stage 2</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
