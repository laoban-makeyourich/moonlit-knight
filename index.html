<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonlit Knight — A Storybook Deck-Builder</title>
<meta name="description" content="Moonlit Knight: a turn-based storybook deck-builder. Original art, cards and monsters.">
<link rel="preload" as="image" href="assets/ui/knight.jpg">
<link rel="preload" as="image" href="assets/ui/bg-table.jpg">
<style>
  :root{
    --ink:#e8ddc4; --ink-dim:#b8a97f; --gold:#d4af37; --red:#a83a3a;
    --panel:rgba(20,16,28,.88); --panel-border:#5a4a2f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:Georgia,'Times New Roman',serif; color:var(--ink);
    background:#0d0a14 url("assets/ui/bg-table.jpg") center/cover no-repeat fixed;
    overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .hidden{display:none !important;}

  /* ---------- Title screen ---------- */
  #title-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px; text-align:center;
    background:radial-gradient(ellipse at center, rgba(13,10,20,.25) 0%, rgba(13,10,20,.78) 100%);
  }
  #title-screen h1{
    font-size:clamp(44px, 8vw, 84px); letter-spacing:.08em; color:#f3e6c0;
    text-shadow:0 2px 0 #000, 0 0 28px rgba(212,175,55,.45);
  }
  #title-screen .subtitle{font-style:italic; color:var(--ink-dim); font-size:clamp(15px,2.4vw,20px);}
  #hero{width:min(300px, 62vw); border-radius:10px; border:3px solid var(--panel-border);
    box-shadow:0 12px 40px rgba(0,0,0,.7); will-change:transform;}
  .btn{
    font-family:inherit; font-size:20px; letter-spacing:.06em; cursor:pointer;
    color:#1a1206; background:linear-gradient(#e8c96a,#c9a227);
    border:2px solid #6b5320; border-radius:8px; padding:13px 42px;
    box-shadow:0 4px 0 #6b5320, 0 8px 22px rgba(0,0,0,.55);
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #6b5320;}
  .btn:disabled{opacity:.5; cursor:default; transform:none;}
  .btn.secondary{background:linear-gradient(#8a7a55,#6b5c3a); color:#f3e6c0; border-color:#3d3220; font-size:16px; padding:10px 28px;}
  #loading{font-size:15px; color:var(--ink-dim); font-style:italic; min-height:20px;}
  #version{position:absolute; bottom:10px; right:14px; font-size:12px; color:#8a7d5f;}
  #title-screen .foot{font-size:13px; color:#8a7d5f; max-width:520px; line-height:1.5;}

  /* ---------- Generic screens (filled in later stages) ---------- */
  #game-screen{flex:1; display:flex; flex-direction:column; position:relative;}
  #banner{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.9);
    font-size:clamp(30px,6vw,54px); color:#f3e6c0; letter-spacing:.1em;
    text-shadow:0 2px 0 #000, 0 0 30px rgba(212,175,55,.6);
    opacity:0; pointer-events:none; transition:opacity .35s ease, transform .35s ease;
    background:linear-gradient(rgba(60,40,20,.85),rgba(40,26,12,.85));
    border:2px solid var(--panel-border); border-radius:10px; padding:14px 44px; white-space:nowrap;
  }
  #banner.show{opacity:1; transform:translate(-50%,-50%) scale(1);}

  /* ---------- Combat screen (Stage 2, layout reworked v0.5) ---------- */
  #combat-root{position:absolute; inset:0;}
  /* Top bar (original layout): blessing circles top-left, gold, back arrow. */
  .combat-topbar{position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:14px; padding:8px 14px;
    background:linear-gradient(rgba(20,16,28,.85), rgba(20,16,28,0));
    pointer-events:none;}
  .blessing-dots{display:flex; gap:6px; pointer-events:auto;}
  .blessing-dot{width:26px; height:26px; border-radius:50%; border:2px solid var(--gold);
    background:radial-gradient(circle at 35% 30%, #f3e6c0, #c9a227 60%, #8a6d1f);
    color:#1a1206; font-size:13px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.6);}
  .blessing-dot.empty{background:transparent; border-color:rgba(212,175,55,.4); box-shadow:none;}
  .topbar-spacer{flex:1;}
  .topbar-gold{font-size:18px; color:var(--gold); display:flex; align-items:center; gap:6px;
    text-shadow:0 1px 2px #000; pointer-events:auto;}
  .topbar-back{pointer-events:auto; font-family:inherit; font-size:18px; cursor:pointer; color:#f3e6c0;
    background:rgba(20,16,28,.85); border:2px solid var(--panel-border); border-radius:8px; padding:4px 12px;}
  .topbar-back:hover{border-color:var(--gold);}
  .enemy-area{position:absolute; top:52px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px; width:min(420px, 80vw);}
  .enemy-area.drop-target .enemy-portrait{
    box-shadow:0 0 0 3px #35e0d4, 0 0 34px rgba(53,224,212,.8), 0 8px 28px rgba(0,0,0,.7);}
  .enemy-area.drop-target .enemy-name{
    box-shadow:0 0 0 2px #35e0d4, 0 0 22px rgba(53,224,212,.55);}
  .enemy-portrait-wrap{position:relative; width:170px; height:170px;}
  .enemy-portrait{width:170px; height:170px; object-fit:cover; border-radius:8px;
    border:3px solid var(--panel-border); box-shadow:0 8px 28px rgba(0,0,0,.7);}
  /* Name + Lv on a wooden ribbon/banner below the portrait (original). */
  .enemy-name{display:flex; align-items:center; gap:8px; font-size:22px; letter-spacing:.05em;
    color:#f3e6c0; text-shadow:0 2px 0 #000;
    background:linear-gradient(rgba(60,40,20,.92),rgba(40,26,12,.92));
    border:2px solid var(--panel-border); border-radius:6px; padding:4px 18px;
    box-shadow:0 4px 14px rgba(0,0,0,.6);}
  .lv-tag{font-size:13px; color:var(--gold); border:1px solid var(--gold); border-radius:4px;
    padding:1px 7px; vertical-align:middle; letter-spacing:.08em;}
  .enemy-mana-row{display:flex; align-items:center; gap:8px; width:100%;}
  .enemy-mana-row .bar{flex:1;}
  .enemy-hourglass{font-size:15px; color:var(--gold); white-space:nowrap; text-shadow:0 1px 2px #000;}
  .enemy-special{font-size:13px; font-style:italic; color:#f3e6c0; text-align:center;
    background:rgba(10,8,16,.82); border:1px solid #5a4a2f; border-radius:20px; padding:4px 12px;
    max-width:420px;}
  .bar{position:relative; width:100%; height:18px; background:rgba(0,0,0,.6);
    border:1px solid #4a3d24; border-radius:9px; overflow:hidden;}
  .bar.thin{height:7px; border-radius:4px;}
  .bar-fill{height:100%; transition:width .35s ease;}
  .hp-fill{background:linear-gradient(#c0392b,#8e2418);}
  .mana-fill{background:linear-gradient(#3a7bd5,#1e4f8f);}
  .bar-text{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; text-shadow:0 1px 2px #000; pointer-events:none;}
  /* Combat log: collapsible panel on the left edge (never covers the
     bottom-left deck/discard arches). The notice line lives on its own
     slim strip above the hand so denied plays are always visible. */
  .combat-log{position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:280px; max-width:78vw; z-index:30;
    background:var(--panel); border:1px solid var(--panel-border); border-left:none;
    border-radius:0 8px 8px 0; padding:8px 40px 8px 10px; font-size:13px; line-height:1.45;
    transition:transform .25s ease;}
  .combat-log.collapsed{transform:translateY(-50%) translateX(calc(-100% + 34px));}
  .log-toggle{position:absolute; top:0; right:0; bottom:0; width:34px;
    writing-mode:vertical-rl; font-family:inherit; font-size:12px; letter-spacing:.14em;
    color:var(--gold); background:rgba(0,0,0,.35); border:none; border-left:1px solid var(--panel-border);
    border-radius:0 8px 8px 0; cursor:pointer;}
  .log-title{color:var(--gold); letter-spacing:.08em; font-size:12px; margin-bottom:4px;}
  .log-line{color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .combat-notice{position:absolute; left:50%; bottom:158px; transform:translateX(-50%);
    font-size:14px; color:#e8a33d; font-style:italic; text-shadow:0 1px 2px #000;
    pointer-events:none; z-index:15; min-height:20px; text-align:center; white-space:nowrap;}
  /* Deck / discard piles: two arch frames, bottom-left (our own design;
     the original's two bottom-left arches are unlabeled in the footage). */
  .deck-piles{position:absolute; left:14px; bottom:22px; display:flex; gap:12px; z-index:5;}
  .pile-arch{width:74px; text-align:center;}
  .pile-card{width:74px; height:104px; border-radius:37px 37px 8px 8px;
    border:3px solid var(--panel-border);
    background:#1a1426 url("assets/ui/cardback.jpg") center/cover;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,.7);}
  .pile-num{font-size:28px; color:#f3e6c0; text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.9);}
  .pile-label{font-size:12px; color:#f3e6c0; font-style:italic; margin-top:4px;
    white-space:nowrap; background:rgba(10,8,16,.82); border:1px solid #5a4a2f;
    border-radius:20px; padding:2px 8px; display:inline-block;}
  .equip-row{position:absolute; left:50%; bottom:246px; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px; min-height:44px;}
  .equip-empty{font-size:13px; font-style:italic; color:#f3e6c0;
    background:rgba(10,8,16,.82); border:1px solid #5a4a2f; border-radius:20px; padding:4px 12px;}
  .equip-chip{width:42px; height:42px; border-radius:50%; overflow:hidden;
    border:2px solid var(--gold); box-shadow:0 2px 8px rgba(0,0,0,.6);}
  .equip-chip.empty{background:rgba(10,8,16,.45); border:2px dashed #6b5a35; box-shadow:none;}
  .equip-chip.counter{border-color:#c77dd8;}
  .equip-chip img{width:100%; height:100%; object-fit:cover;}
  .equip-slots{font-size:13px; color:var(--ink-dim); margin-left:4px;}
  .hud{position:absolute; left:50%; bottom:186px; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px; width:min(520px, 72vw);
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:8px 14px;}
  .hud-hp{flex:1; display:flex; align-items:center; gap:8px;}
  .hud-hp .bar{flex:1;}
  .armor-badge{font-size:15px; color:#8ec9ff; background:#12365e; border:1px solid #3a7bd5;
    border-radius:6px; padding:2px 8px; white-space:nowrap;}
  .hud-mana{flex:1;}
  .hud-mana .bar{width:100%;}
  .hud-action,.hud-gold{display:flex; align-items:center; gap:5px; font-size:17px; white-space:nowrap;}
  .hourglass{color:var(--gold);}
  .player-area{position:absolute; right:18px; bottom:14px; display:flex; align-items:flex-end; gap:12px;}
  .player-portrait-wrap{position:relative; width:120px; height:150px;}
  .player-portrait{width:120px; height:150px; object-fit:cover;
    border:3px solid var(--panel-border); border-radius:60px 60px 8px 8px;
    box-shadow:0 8px 24px rgba(0,0,0,.7);}
  .end-turn-btn{background:linear-gradient(#7bc96a,#3f8f2f); border-color:#245c18;
    box-shadow:0 4px 0 #245c18, 0 8px 22px rgba(0,0,0,.55); padding:12px 26px; font-size:18px;}
  .end-turn-btn:disabled{opacity:.45; cursor:default;}
  .hand{position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
    display:flex; align-items:flex-end; justify-content:center; gap:6px; z-index:10;}
  .hand-card{width:96px; height:146px; object-fit:cover; border-radius:6px; cursor:grab;
    border:2px solid #3d3220; box-shadow:0 6px 18px rgba(0,0,0,.65);
    transform:rotate(var(--fan-rot, 0deg)) translateY(var(--fan-y, 0px));
    transform-origin:bottom center; touch-action:none; will-change:transform;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;}
  .hand-card.playable{border-color:#7fd4c1;}
  .hand-card.playable:hover,.hand-card.playable:focus-visible{
    transform:rotate(0deg) translateY(-14px) scale(1.12); z-index:20;
    box-shadow:0 0 0 2px #35e0d4, 0 0 26px rgba(53,224,212,.65), 0 18px 40px rgba(0,0,0,.8);}
  /* While dragging the card follows the pointer exactly (no transition
     lag); on release the class is removed and it glides back home. */
  .hand-card.dragging{transition:none; z-index:80; cursor:grabbing;
    box-shadow:0 0 0 2px #35e0d4, 0 0 30px rgba(53,224,212,.8), 0 18px 40px rgba(0,0,0,.8);}
  /* Enlarged card preview: a separate element with pointer-events:none,
     so it can never cover a neighbour and steal its click. aspect-ratio +
     a solid background give the box its size even before the image loads
     (a zero-height box was one suspect in the missing-preview report). */
  #card-preview{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    width:min(210px,42vw); aspect-ratio:342 / 519; object-fit:cover; background:#1a1426;
    z-index:70; pointer-events:none; opacity:0;
    transition:opacity .15s ease; border-radius:8px; border:2px solid #35e0d4;
    box-shadow:0 0 26px rgba(53,224,212,.65), 0 18px 40px rgba(0,0,0,.8);}
  #card-preview.show{opacity:1;}
  .hand-card.unplayable{filter:grayscale(.6) brightness(.72);}
  .hand-card.shake{animation:shake .3s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}}
  .float-layer{position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:40;}
  .floater{position:absolute; left:50%; top:32%; font-size:30px; font-weight:bold;
    text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); white-space:nowrap;
    animation:float-up 1s ease-out forwards; pointer-events:none;}
  .floater.dmg{color:#ff5a4a;}
  .floater.heal{color:#6fdc6f;}
  .floater.armor{color:#6fb7ff;}
  @keyframes float-up{
    0%{opacity:0; transform:translate(-50%,0) scale(.8);}
    15%{opacity:1; transform:translate(-50%,-14px) scale(1.1);}
    100%{opacity:0; transform:translate(-50%,-72px) scale(1);}}
  .overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; background:rgba(10,8,16,.78); z-index:100; text-align:center;}
  .overlay-title{font-size:clamp(40px,7vw,64px); color:#f3e6c0; letter-spacing:.08em;
    text-shadow:0 2px 0 #000, 0 0 30px rgba(212,175,55,.5);}
  .overlay-line{font-size:18px; color:var(--ink-dim); font-style:italic;}
  .overlay-btns{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}

  /* ---------- Book / chapter screen (Stage 3) ---------- */
  #book-root{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;}
  .book-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;}
  .book-topbar{position:relative; z-index:2; width:100%; display:flex; align-items:center;
    justify-content:center; gap:26px; flex-wrap:wrap;
    background:var(--panel); border-bottom:2px solid var(--panel-border);
    padding:10px 18px; font-size:18px; letter-spacing:.04em;}
  .book-topbar .book-gold{color:var(--gold);}
  .book-topbar .book-hp{color:#ff8d7a;}
  .book-topbar .book-chapter{color:#f3e6c0; font-weight:bold;}
  .book-topbar .book-pages-left{color:var(--ink-dim); font-style:italic;}
  .book-pages{position:relative; z-index:2; flex:1; display:flex; align-items:center;
    justify-content:center; gap:22px; flex-wrap:wrap; padding:24px;}
  .book-hint{position:relative; z-index:2; padding:0 18px 18px; font-style:italic; color:var(--ink-dim); font-size:15px;}
  .page-card{width:210px; background:var(--panel); border:2px solid var(--panel-border);
    border-radius:10px; padding:0 0 12px; cursor:pointer; overflow:hidden;
    font-family:inherit; color:var(--ink); text-align:center;
    box-shadow:0 8px 26px rgba(0,0,0,.6);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .page-card:hover{transform:translateY(-8px); border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(212,175,55,.5), 0 16px 34px rgba(0,0,0,.75);}
  .page-card.boss{border-color:#c0392b; box-shadow:0 0 0 2px rgba(192,57,43,.55), 0 8px 26px rgba(0,0,0,.6);}
  .page-card.boss:hover{border-color:#ff6b5a;}
  .page-art{width:100%; height:240px; object-fit:cover; display:block;}
  .page-title{font-size:20px; color:#f3e6c0; margin-top:10px; letter-spacing:.04em;}
  .page-sub{font-size:13px; color:var(--ink-dim); font-style:italic; margin-top:4px; padding:0 10px; line-height:1.4;}

  /* ---------- Book modal (shop / events / smithy / level-up / victory) ---------- */
  .book-modal{position:absolute; inset:0; z-index:50; display:flex; align-items:center;
    justify-content:center; background:rgba(10,8,16,.72); padding:20px;
    opacity:1; transition:opacity .2s ease;}
  .book-modal.hidden{opacity:0; pointer-events:none;}
  .modal-panel{width:min(680px, 94vw); max-height:92%; overflow-y:auto;
    background:var(--panel); border:2px solid var(--panel-border); border-radius:12px;
    padding:20px 22px; display:flex; flex-direction:column; align-items:center; gap:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.8); text-align:center;}
  .modal-art{width:100%; max-height:220px; object-fit:cover; border-radius:8px;
    border:2px solid var(--panel-border);}
  .modal-title{font-size:28px; color:#f3e6c0; letter-spacing:.05em;}
  .modal-text{font-size:15px; color:var(--ink-dim); font-style:italic; line-height:1.5;}
  .modal-row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .modal-notice{color:#e8a33d; font-style:italic; min-height:20px; font-size:14px;}
  .shop-grid{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .shop-card{width:180px; background:rgba(0,0,0,.35); border:2px solid var(--panel-border);
    border-radius:8px; padding:0 0 10px; cursor:pointer; font-family:inherit; color:var(--ink);
    transition:transform .15s ease, border-color .15s ease;}
  .shop-card:hover{transform:translateY(-4px); border-color:var(--gold);}
  .shop-card.sold{opacity:.45; cursor:default;}
  .shop-card-art{width:100%; height:150px; object-fit:cover; display:block; border-radius:6px 6px 0 0;}
  .shop-card-name{font-size:16px; color:#f3e6c0; margin-top:8px;}
  .shop-card-text{font-size:12px; color:var(--ink-dim); font-style:italic; padding:4px 8px 0; line-height:1.35; min-height:32px;}
  .shop-card-price{font-size:15px; color:var(--gold); margin-top:6px;}
  .blessing-btn,.levelup-option{width:100%; background:rgba(0,0,0,.35);
    border:2px solid var(--panel-border); border-radius:8px; padding:12px 16px;
    cursor:pointer; font-family:inherit; color:var(--ink); text-align:left;
    transition:transform .15s ease, border-color .15s ease;}
  .blessing-btn:hover,.levelup-option:hover{transform:translateY(-2px); border-color:var(--gold);}
  .blessing-btn:disabled{opacity:.5; cursor:default; transform:none;}
  .blessing-name,.levelup-name{font-size:18px; color:#f3e6c0;}
  .blessing-text,.levelup-text{font-size:14px; color:var(--ink-dim); font-style:italic; margin-top:3px; line-height:1.4;}
  .levelup-option{display:flex; flex-direction:column; align-items:center; text-align:center;}
  .levelup-thumb{width:110px; height:168px; object-fit:cover; border-radius:6px; border:2px solid var(--panel-border);}
  .smithy-list{width:100%; display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto;}
  .smithy-row{width:100%; display:flex; align-items:center; gap:12px;
    background:rgba(0,0,0,.35); border:1px solid var(--panel-border); border-radius:8px;
    padding:6px 12px 6px 6px; cursor:pointer; font-family:inherit; color:var(--ink);
    transition:transform .15s ease, border-color .15s ease;}
  .smithy-row:hover{transform:translateX(4px); border-color:var(--gold);}
  .smithy-row:disabled{opacity:.55; cursor:default; transform:none;}
  .smithy-row:disabled:hover{border-color:var(--panel-border);}
  .smithy-note{font-size:13px; color:#c77dd8; font-style:italic; white-space:nowrap;}
  .smithy-thumb{width:40px; height:60px; object-fit:cover; border-radius:4px;}
  .smithy-name{flex:1; text-align:left; font-size:16px; color:#f3e6c0;}
  .smithy-cost{font-size:15px; color:var(--gold); white-space:nowrap;}
  .victory-stats{display:flex; flex-direction:column; gap:6px; font-size:18px; color:var(--ink);}
  .victory-stat{letter-spacing:.04em;}
</style>
</head>
<body>
<div id="app">
  <section id="title-screen">
    <h1>MOONLIT KNIGHT</h1>
    <div class="subtitle">A turn-based storybook deck-builder</div>
    <img id="hero" src="assets/ui/knight.jpg" alt="The Moonlit Knight" width="300" height="450" fetchpriority="high">
    <button id="start-btn" class="btn" disabled>Loading…</button>
    <div id="loading">Preparing the book…</div>
    <div class="foot">Original cards, monsters and art. Play cards, raise Armor, and turn the pages of the book — three chapters, one final witch.</div>
  </section>
  <section id="game-screen" class="hidden">
